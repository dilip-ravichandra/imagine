# Run the whole website:   docker compose up -d --build      then open http://localhost:8000
name: imagineai
services:
  imagineai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    image: imagineai:latest
    container_name: imagineai
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false          # works with no .env at all (AI chat/translate/learn then need a Groq key)
    environment:
      COOKIE_SECURE: "0"         # plain http on localhost
      DEVICE: ${DEVICE:-auto}
    volumes:
      - imagineai_data:/data     # accounts, your gallery, generated images and downloaded models survive restarts
    restart: unless-stopped
volumes:
  imagineai_data:
